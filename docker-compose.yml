services:
  manga-translator:
    image: zyddnys/manga-image-translator:main
    container_name: manga-translator
    entrypoint: python
    command: server/main.py --verbose --start-instance --host=0.0.0.0 --port=5003
    ports:
      - "5003:5003"
    ipc: host
    volumes:
      - manga-models:/app/models
      - manga-result:/app/result
    # GPU support: uncomment the deploy section below
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: all
               capabilities: [gpu]
    restart: unless-stopped

volumes:
  manga-models:
  manga-result:
